<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>For Anjali — A Little Surprise</title>

<!-- Google Fonts (pretty & romantic) -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
  :root{
    --bg1: #0f1724;      /* deep navy */
    --bg2: #2b1b3a;      /* purple gradient dark */
    --accent: #ff6b9a;   /* pink */
    --accent-2:#ffd36b;  /* warm gold */
    --muted: rgba(255,255,255,0.9);
  }
  html,body{height:100%;margin:0;font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
  body{
    background: radial-gradient(1200px 600px at 10% 20%, rgba(255,107,154,0.06), transparent 8%),
                radial-gradient(900px 500px at 90% 80%, rgba(255,211,107,0.04), transparent 6%),
                linear-gradient(180deg,var(--bg1), var(--bg2));
    color:var(--muted);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* Card */
  .card{
    width:min(920px,96vw);
    border-radius:20px;
    padding:36px;
    background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    box-shadow: 0 10px 40px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    position:relative;
    overflow:visible;
    backdrop-filter: blur(6px) saturate(120%);
    display:grid;
    grid-template-columns: 1fr 420px;
    gap:28px;
    align-items:center;
  }

  /* left content */
  .left{
    padding-right:8px;
  }
  .logo{
    display:flex;align-items:center;gap:12px;margin-bottom:6px;
  }
  .logo .glyph{
    width:52px;height:52px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent), #ff8fb2);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;
    box-shadow: 0 6px 18px rgba(255,107,154,0.18);
    transform:rotate(-6deg);
    font-family:"Great Vibes", cursive;
    font-size:22px;
  }
  .logo .title{font-weight:700;font-size:18px;color:var(--muted);letter-spacing:0.2px}
  .subtitle{color:rgba(255,255,255,0.72);margin-bottom:18px}

  /* big heading */
  h1{
    font-family:"Great Vibes",cursive;
    font-size:54px;margin:6px 0 8px 0;color:var(--accent);
    text-shadow: 0 6px 28px rgba(255,107,154,0.12);
  }
  .meta{
    color:rgba(255,255,255,0.76);font-size:16px;margin-bottom:18px;
  }

  /* poem box */
  .poem{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.04);
    padding:18px;border-radius:12px;line-height:1.6;
    font-size:16px;color:rgba(255,255,255,0.9);
    min-height:140px;
  }
  .poem p{margin:8px 0;opacity:0.98}

  /* CTA & small note */
  .actions{display:flex;gap:12px;margin-top:16px;align-items:center}
  .btn{
    padding:12px 18px;border-radius:999px;border:0;cursor:pointer;font-weight:600;
    box-shadow: 0 8px 30px rgba(43,27,58,0.28);
    transition:transform .18s ease, box-shadow .18s ease;
    background: linear-gradient(90deg,var(--accent), #ff8fb2);
    color:white;
  }
  .btn:active{transform:translateY(2px)}
  .ghost{
    padding:10px 14px;background:transparent;border-radius:10px;border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.9)
  }
  .small{font-size:13px;color:rgba(255,255,255,0.6)}

  /* right panel: portrait + heart */
  .right{
    position:relative;padding:20px;border-radius:14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.005));
    border: 1px solid rgba(255,255,255,0.03);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  }

  .portrait{
    width:220px;height:220px;border-radius:16px;overflow:hidden;display:flex;
    align-items:center;justify-content:center;background:linear-gradient(180deg,#291032,#3a163f);
    box-shadow: 0 8px 24px rgba(10,6,20,0.6);
    position:relative;border:6px solid rgba(255,255,255,0.03);
  }
  .portrait .initial{
    font-family:"Great Vibes";font-size:62px;color:var(--accent);opacity:0.98;
    text-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .floating-heart{
    font-size:42px;color:var(--accent);transform-origin:center;
    filter:drop-shadow(0 8px 20px rgba(255,107,154,0.14));
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty{
    0%{transform:translateY(0) rotate(-6deg)}
    50%{transform:translateY(-12px) rotate(4deg)}
    100%{transform:translateY(0) rotate(-6deg)}
  }

  /* tiny caption */
  .caption{font-size:13px;color:rgba(255,255,255,0.6);text-align:center;padding:0 6px}

  /* bottom ribbon */
  .ribbon{
    position:absolute;left:50%;transform:translateX(-50%);bottom:-28px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    padding:10px 20px;border-radius:999px;color:#0b0b0b;font-weight:700;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.06);
  }

  /* confetti canvas overlay */
  #confetti { position:fixed;pointer-events:none;inset:0;z-index:80; }

  /* responsive */
  @media (max-width:880px){
    .card{grid-template-columns:1fr; padding:22px}
    .portrait{width:160px;height:160px}
    h1{font-size:44px}
  }
</style>
</head>

<body>
<canvas id="confetti"></canvas>

<main class="card" role="main" aria-labelledby="title">
  <section class="left" aria-label="message">
    <div class="logo" aria-hidden="true">
      <div class="glyph">A</div>
      <div>
        <div class="title">A Surprise for Anjali</div>
        <div class="subtitle small">crafted with heart — open it when she's ready ✨</div>
      </div>
    </div>

    <h1 id="title">Anjali</h1>
    <div class="meta">A small moment made just for you — elegant, warm, and a little bit magical.</div>

    <div id="poem" class="poem" aria-live="polite">
      <!-- typed content will appear here -->
    </div>

    <div class="actions" role="group" aria-label="actions">
      <button id="openBtn" class="btn">Open the surprise</button>
      <button id="replayBtn" class="ghost small" style="display:none">Play again</button>
      <div style="flex:1"></div>
      <div class="small">From Aman — with 💖</div>
    </div>
  </section>

  <aside class="right" aria-label="visual">
    <div class="portrait" aria-hidden="true">
      <div style="text-align:center">
        <div class="initial">A</div>
        <div class="floating-heart">❤</div>
      </div>
    </div>
    <div class="caption">You are loved more than i can say — just wanted you to know.</div>
  </aside>

  <div class="ribbon" id="ribbon" style="display:none">💍 Will you spend the rest of your life with me? 💖</div>
</main>

<script>
/* =========================
   Poem text + typewriter
   ========================= */
const poemLines = [
  "hey Anjali,",
  "i saw a thousand little beautiful things today —",
  "and every single one reminded me of you.",
  "your laugh turns small moments into memories,",
  "and your smile makes the world feel softer.",
  "i made this for you because you deserve to see",
  "how much light you bring. ✨",
  "",
  "— Aman"
];

const poemEl = document.getElementById('poem');
const openBtn = document.getElementById('openBtn');
const replayBtn = document.getElementById('replayBtn');
const ribbon = document.getElementById('ribbon');

let typing = false;

/* simple typewriter that prints centered lines */
function centerLine(text){
  // mimic centering inside the poem box:
  return '<div style="text-align:center">' + text + '</div>';
}

async function typePoem(){
  if(typing) return;
  typing = true;
  poemEl.innerHTML = "";
  // small pause
  await wait(450);

  for(let i=0;i<poemLines.length;i++){
    await typeLine(poemLines[i]);
    await wait(420);
  }

  // show ribbon and confetti
  ribbon.style.display = 'block';
  animateRibbon();
  launchConfetti();
  replayBtn.style.display = 'inline-block';
  typing = false;
}

function typeLine(line){
  return new Promise(resolve=>{
    const container = document.createElement('div');
    container.style.opacity = '0';
    container.style.transition = 'opacity .28s ease';
    poemEl.appendChild(container);

    // type char by char
    let idx = 0;
    const charDelay = 28 + Math.random()*16;
    const interval = setInterval(()=>{
      container.innerHTML = centerLine(escapeHtml(line.slice(0, idx)));
      idx++;
      if(idx > line.length){
        clearInterval(interval);
        container.style.opacity = '1';
        resolve();
      }
    }, charDelay);
  });
}

function wait(ms){return new Promise(r=>setTimeout(r,ms));}

/* minimal HTML escape */
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* =========================
   Ribbon animation
   ========================= */
function animateRibbon(){
  ribbon.style.transform = 'translateY(28px)';
  ribbon.style.opacity = '0';
  ribbon.style.transition = 'transform .6s cubic-bezier(.2,.9,.2,1), opacity .45s ease';
  requestAnimationFrame(()=>{
    ribbon.style.transform = 'translateY(0)';
    ribbon.style.opacity = '1';
  });
}

/* =========================
   Confetti (canvas) - tiny particle system
   ========================= */
const confettiCanvas = document.getElementById('confetti');
const ctx = confettiCanvas.getContext('2d');
let W = innerWidth, H = innerHeight;
confettiCanvas.width = W; confettiCanvas.height = H;

window.addEventListener('resize', ()=>{
  W = innerWidth; H = innerHeight;
  confettiCanvas.width = W; confettiCanvas.height = H;
});

/* particle factory */
function makeParticle(x,y){
  const shapes = ['rect','circle','triangle'];
  return {
    x, y,
    vx: (Math.random()-0.5)*6,
    vy: Math.random()*-8 - 2,
    size: 6 + Math.random()*10,
    life: 80 + Math.floor(Math.random()*60),
    age: 0,
    shape: shapes[Math.floor(Math.random()*shapes.length)],
    color: pick(['#ff6b9a', '#ffd36b', '#ff9bb2', '#fff3bf', '#ffb3c6']),
    rotate: Math.random()*360,
    vr: (Math.random()-0.5)*10
  };
}
let particles = [];
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function launchConfetti(){
  // produce a burst of particles at center-top
  const cx = W*0.5;
  const cy = H*0.28;
  for(let i=0;i<140;i++){
    particles.push(makeParticle(cx + (Math.random()-0.5)*240, cy + (Math.random()-0.5)*40));
  }
  // animate for a while
  let frames = 0;
  const anim = ()=>{
    frames++;
    ctx.clearRect(0,0,W,H);
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.age++;
      p.vy += 0.18; // gravity
      p.x += p.vx;
      p.y += p.vy;
      p.rotate += p.vr;
      p.size *= 0.997;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rotate*Math.PI/180);
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = p.color;
      if(p.shape === 'rect'){
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.7);
      } else if(p.shape === 'circle'){
        ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.moveTo(0,-p.size/1.6); ctx.lineTo(p.size/1.8,p.size/1.8); ctx.lineTo(-p.size/1.8,p.size/1.8); ctx.closePath(); ctx.fill();
      }
      ctx.restore();

      if(p.age > p.life || p.y > H + 60) particles.splice(i,1);
    }
    if(particles.length>0 && frames < 1000) requestAnimationFrame(anim);
    else ctx.clearRect(0,0,W,H);
  };
  anim();
}

/* =========================
   controls
   ========================= */
openBtn.addEventListener('click', ()=>{
  openBtn.disabled = true;
  openBtn.style.transform = 'scale(.98)';
  typePoem().then(()=> openBtn.style.display = 'none');
});

replayBtn.addEventListener('click', ()=>{
  ribbon.style.display = 'none';
  replayBtn.style.display = 'none';
  openBtn.style.display = 'inline-block';
  openBtn.disabled = false;
  poemEl.innerHTML = '';
});

/* make it keyboard-friendly: press Enter to open */
document.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !openBtn.disabled) openBtn.click();
});
</script>
</body>
</html>
